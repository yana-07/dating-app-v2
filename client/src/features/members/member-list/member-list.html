@if (paginatedResult(); as paginatedResult) {
  <div class="flex flex-col w-full">
    <div class="flex justify-between items-center">
      <div class="flex gap-3">
        <button (click)="openModal()" class="btn btn-primary">Select Filters</button>
        <button (click)="resetFilters()" class="btn btn-neutral">Reset Filters</button>
      </div>
      <app-filter-modal #filterModal (submitFilters)="onSubmit($event)" />
      <app-paginator
        [(page)]="page"
        [(pageSize)]="pageSize"
        [totalCount]="paginatedResult.metadata.totalCount"
        [totalPages]="paginatedResult.metadata.totalPages"
      />
    </div>
    @if (paginatedResult.items.length) {
      <div class="grid grid-cols-5 gap-6">
        @for (member of paginatedResult.items; track member.id) {
          <app-member-card [member]="member" />
        }
      </div>
    }
  </div>
}
