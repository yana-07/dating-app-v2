@if (paginatedResult(); as paginatedResult) {
  <div class="flex justify-between items-center">
    <div class="tabs tabs-box tabs-lg text-primary w-fit">
      @for(tab of tabs; track $index) {
        <button 
          role="tab" 
          class="tab" 
          [class.tab-active]="predicate() === tab.value"
          (click)="setPredicate(tab.value)"
        >
          {{ tab.label }}
        </button>
      }
    </div>
    <app-paginator
      [hidden]="paginatedResult.metadata.totalCount === 0"
      [page]="paginatedResult.metadata.page"
      (pageChange)="onPageChange($event)"
      [pageSize]="paginatedResult.metadata.pageSize"
      (pageSizeChange)="onPageSizeChange($event)"
      [totalCount]="paginatedResult.metadata.totalCount"
      [totalPages]="paginatedResult.metadata.totalPages"
    />
  </div>

  @if (paginatedResult.items.length > 0) {
    <div class="grid grid-cols-5 gap-6 mt-3">
      @for (member of paginatedResult.items; track member.id) {
        <app-member-card [member]="member" />
      }
    </div>
  } @else {
    <div class="mt-3 text-lg">There are no results for this filter.</div>
  }
}
