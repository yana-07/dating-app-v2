<div
  class="card bg-base-100 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg"
>
  <div class="card-title justify-center text-3xl text-primary">Sign up</div>
  <div class="card-body w-full">
    <form 
      [formGroup]="registerForm" 
      (ngSubmit)="register()" 
      class="flex flex-col gap-4 w-full"
    >
      <label class="floating-label">
        <span>Email</span>
        <input
          formControlName="email"
          class="input w-full"
          placeholder="Email"
        />
      </label>
      <label class="floating-label text-left">
        <span>Display name</span>
        <input
          formControlName="displayName"
          class="input w-full"
          placeholder="Display name"
        />
      </label>
      <label class="floating-label">
        <span>Password</span>
        <input
          formControlName="password"
          type="password"
          class="input w-full"
          placeholder="Password"
        />
      </label>
      <label class="floating-label">
        <span>Confirm password</span>
        <input
          formControlName="confirmPassword"
          type="password"
          class="input w-full"
          placeholder="Confirm password"
        />
      </label>
      <div class="flex items-center justify-end gap-3">
        <button (click)="cancel()" class="btn" type="button">Cancel</button>
        <button [disabled]="registerForm.invalid" class="btn btn-primary">Register</button>
      </div>
    </form>
  </div>

  <div class="flex flex-col items-start px-3 w-full mockup-code text-lg">
    <div>Form value: {{ registerForm.value | json }}</div>
    <div>Form status: {{ registerForm.status }}</div>
  </div>
</div>
