<div
  class="card bg-base-100 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg"
>
  <div class="card-title justify-center text-3xl text-primary">Sign up</div>
  <div class="card-body w-full">
    <form (ngSubmit)="register()" class="flex flex-col gap-4 w-full">
      <input
        [(ngModel)]="credentials.email"
        name="email"
        class="input w-full"
        placeholder="Email"
      />
      <input
        [(ngModel)]="credentials.displayName"
        name="displayName"
        class="input w-full"
        placeholder="Display name"
      />
      <input
        [(ngModel)]="credentials.password"
        type="password"
        name="password"
        class="input w-full"
        placeholder="Password"
      />
      <div class="flex items-center justify-end gap-3">
        <button (click)="cancel()" class="btn" type="button">Cancel</button>
        <button class="btn btn-primary">Register</button>
      </div>
    </form>
  </div>
</div>
